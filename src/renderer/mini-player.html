<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin"><title>Isótopus · Mini player</title><link rel="stylesheet" href="styles/mini-player.css"></head>
<body><main class="mini-shell" id="miniShell"><button class="drag-region" aria-label="Mover mini player" title="Arraste para mover"></button><div class="mini-main"><div class="mini-cover" id="miniCover"></div><div class="mini-info"><b id="miniTitle">Isótopus</b><small id="miniArtist">Abra uma música no player principal</small></div><button class="mini-pin" id="miniPin" title="Manter acima das outras janelas" aria-label="Manter acima das outras janelas" aria-pressed="false">⌖</button><button class="mini-size" id="miniSize" title="Recolher mini player" aria-label="Recolher mini player" aria-expanded="true">⌄</button><button class="mini-close" id="miniClose" title="Ocultar mini player" aria-label="Ocultar mini player">×</button></div><div class="mini-controls"><div class="transport-controls"><button id="miniPrevious" title="Faixa anterior" aria-label="Faixa anterior">|◀</button><button class="mini-play" id="miniPlay" title="Reproduzir ou pausar" aria-label="Reproduzir">▶</button><button id="miniNext" title="Próxima faixa" aria-label="Próxima faixa">▶|</button></div><span id="miniElapsed">0:00</span><input id="miniSeek" class="mini-seek" type="range" min="0" max="100" value="0" aria-label="Posição da faixa"><span id="miniDuration">0:00</span><div class="mini-volume-control"><button id="miniVolumeToggle" class="mini-volume-toggle" aria-label="Abrir controle de volume" aria-expanded="false" title="Volume"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3Z"/><path d="M16 9a5 5 0 0 1 0 6M18.5 6a9 9 0 0 1 0 12"/></svg></button><div class="mini-volume-popover" id="miniVolumePopover" hidden><input id="miniVolume" type="range" min="0" max="100" value="75" aria-label="Volume"></div></div></div></main><script src="mini-player.js" defer></script></body></html>
